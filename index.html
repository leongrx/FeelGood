<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#07090f">
  <title>STARK FIT // MARK LXXXV</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="hud-header">
    <div class="hud-title">STARK FIT // HUD</div>
    <div class="hud-badge" id="hud-clock">SYS ONLINE</div>
  </div>

  <div class="container">

    <!-- TAB 1: VERLAUF -->
    <div id="view-history">
      <div class="sec-title">
        <span>EINSATZ-PROTOKOLL (VERLAUF)</span>
        <span id="hist-count" style="color:var(--arc)">0 WORKOUTS</span>
      </div>
      <div id="history-list"></div>
    </div>

    <!-- TAB 2: WORKOUT & VORLAGEN -->
    <div id="view-workout" class="hidden">
      <div id="active-session-box" class="hidden">
        <div class="live-banner">
          <div>
            <div style="font-size:0.7rem;color:var(--gold);font-family:'Orbitron'">AKTIVE MISSION</div>
            <div id="live-title" style="font-size:1.15rem;font-weight:700;">EMOM</div>
          </div>
          <div style="display:flex;gap:6px;align-items:center;">
            <div class="timer-pill" id="live-timer">00:00</div>
            <button class="btn btn-arc btn-sm" onclick="toggleEmomTimer()" id="emom-btn">EMOM 60s</button>
          </div>
        </div>

        <div id="live-exercises"></div>

        <div class="row" style="margin-bottom:10px;">
          <input id="new-ex-name" placeholder="Übung hinzufügen (z.B. Chest Dip)">
          <button class="btn btn-arc btn-sm" onclick="addExerciseToLive()">+ ÜBUNG</button>
        </div>

        <div class="row">
          <button class="btn btn-ghost" onclick="cancelWorkout()">ABBRECHEN</button>
          <button class="btn btn-crimson" onclick="finishWorkout()">MISSION BEENDEN</button>
        </div>
      </div>

      <div id="templates-box">
        <button class="btn btn-crimson" style="margin-bottom:14px;" onclick="startEmptyWorkout()">
          + FREIES WORKOUT STARTEN
        </button>

        <div class="sec-title">
          <span>MEINE VORLAGEN</span>
          <button class="btn btn-arc btn-sm" onclick="toggleNewTpl()">+ VORLAGE</button>
        </div>

        <div id="new-tpl-form" class="stark-card gold-accent hidden">
          <div class="sec-title">NEUE WORKOUT-VORLAGE</div>
          <input id="tpl-name" placeholder="Vorlagen-Name (z.B. EMOM / Push)" style="margin-bottom:8px;">
          <input id="tpl-exs" placeholder="Übungen mit Komma (z.B. Pull Up, Chest Dip)" style="margin-bottom:8px;">
          <button class="btn btn-gold" onclick="saveTemplate()">VORLAGE SPEICHERN</button>
        </div>

        <div id="templates-list"></div>
      </div>
    </div>

    <!-- TAB 3: J.A.R.V.I.S. KALORIEN & KI -->
    <div id="view-calories" class="hidden">
      <div class="stark-card arc-accent">
        <div class="sec-title">
          <span>ARC-REACTOR ENERGIE</span>
          <span id="cal-date" style="color:var(--muted);font-size:0.75rem;"></span>
        </div>

        <div class="reactor-wrap">
          <div class="reactor-ring" id="cal-ring">
            <div class="reactor-inner">
              <span id="cal-sum" style="font-family:'Orbitron';font-weight:900;font-size:1.05rem;color:#fff;">0</span>
              <span style="font-size:0.65rem;color:var(--arc);">/ <span id="cal-goal-lbl">2500</span></span>
            </div>
          </div>
          <div class="macro-grid">
            <div class="macro-box">
              <div style="font-size:0.7rem;color:var(--muted);">PROTEIN</div>
              <div id="m-prot" style="font-weight:700;color:var(--mint);font-size:1.05rem;">0g</div>
            </div>
            <div class="macro-box">
              <div style="font-size:0.7rem;color:var(--muted);">CARBS</div>
              <div id="m-carb" style="font-weight:700;color:var(--gold);font-size:1.05rem;">0g</div>
            </div>
            <div class="macro-box">
              <div style="font-size:0.7rem;color:var(--muted);">FETT</div>
              <div id="m-fat" style="font-weight:700;color:var(--crimson);font-size:1.05rem;">0g</div>
            </div>
          </div>
        </div>

        <input id="food-input" placeholder="Mahlzeit beschreiben (z.B. 250g Skyr + 1 Banane)..." style="margin-bottom:8px;">
        <div class="row" style="margin-bottom:8px;">
          <label class="btn btn-ghost btn-sm" style="flex:1;text-align:center;cursor:pointer;">
            📷 FOTO-SCAN
            <input type="file" id="food-img" accept="image/*" capture="environment" class="hidden" onchange="previewFoodImg()">
          </label>
          <button class="btn btn-arc" style="flex:2;" onclick="analyzeFoodAI()">J.A.R.V.I.S. ANALYSE</button>
        </div>
        <div id="ai-msg" style="font-size:0.85rem;color:var(--arc);min-height:18px;"></div>
      </div>

      <div class="sec-title">
        <span>HEUTIGE EINNAHME</span>
        <button class="btn btn-ghost btn-sm" onclick="resetTodayCals()">RESET</button>
      </div>
      <div id="food-list"></div>
    </div>

    <!-- TAB 4: SYSTEM & SETUP -->
    <div id="view-setup" class="hidden">
      <div class="stark-card gold-accent">
        <div class="sec-title">J.A.R.V.I.S. KI-SCHNITTSTELLE</div>
        <label style="font-size:0.8rem;color:var(--muted);">GEMINI API KEY (LOKAL GESPEICHERT)</label>
        <input id="cfg-key" type="password" placeholder="AIzaSy..." style="margin:6px 0 10px;">
        <label style="font-size:0.8rem;color:var(--muted);">TAGESZIEL (KCAL)</label>
        <input id="cfg-goal" type="number" value="2500" style="margin:6px 0 10px;">
        <label style="font-size:0.8rem;color:var(--muted);">KÖRPERGEWICHT (KG – FÜR ZUSATZGEWICHT-TRACKING)</label>
        <input id="cfg-bw" type="number" step="0.1" value="80" style="margin:6px 0 12px;">
        <button class="btn btn-gold" onclick="saveSettings()">KONFIGURATION SPEICHERN</button>
      </div>

      <div class="stark-card">
        <div class="sec-title">DATENBANK-BACKUP</div>
        <div class="row">
          <button class="btn btn-arc" onclick="exportBackup()">JSON EXPORT</button>
          <button class="btn btn-ghost" onclick="importBackup()">JSON IMPORT</button>
        </div>
      </div>
    </div>

  </div>

  <!-- BOTTOM HUD NAVIGATION -->
  <div class="hud-nav">
    <button class="nav-item active" id="nav-history" onclick="switchTab('history')">
      <span class="ico">🕒</span><span>VERLAUF</span>
    </button>
    <button class="nav-item center-btn" id="nav-workout" onclick="switchTab('workout')">
      <span class="ico">+</span><span>WORKOUT</span>
    </button>
    <button class="nav-item" id="nav-calories" onclick="switchTab('calories')">
      <span class="ico">⚡</span><span>KALORIEN</span>
    </button>
    <button class="nav-item" id="nav-setup" onclick="switchTab('setup')">
      <span class="ico">⚙️</span><span>SYSTEM</span>
    </button>
  </div>

  <script src="app.js"></script>
</body>
</html>
